  # --- Development-bank / procurement portals (STAGED - awaiting approval) ---
  # All five entries below are DISABLED on purpose. Flip `enabled: true` to
  # start ingesting; nothing is fetched while they are false.
  #
  # IMPORTANT - what these are and are NOT (verified 2026-08-07):
  # None of AfDB, ADB, EBRD, IFC or UNGM publishes a usable native RSS feed or
  # open API for its tender notices. ADB and IFC return 403 to any programmatic
  # request; AfDB, EBRD and UNGM serve their notices pages as JavaScript-rendered
  # HTML (a keyword scan of the fetched HTML finds zero occurrences of
  # mill/grain/flour, i.e. the notices are not in the markup at all), so even an
  # HTML scraper would come back empty without a headless browser.
  #
  # These entries therefore surface the portals via Google News site-scoped
  # feeds, the same technique already used for Miller Magazine and Feed & Grain.
  # That means they carry NEWS AND PROJECT PAGES about each institution - NOT
  # the live structured tender notices with reference numbers and deadlines.
  # Treat them as lead discovery, not as a tender feed. A true tender feed needs
  # a dedicated collector per portal, like collect_worldbank_procurement.py.
  #
  # Each query is keyword-filtered to milling/grain/food-processing so the
  # portals' full firehose (roads, IT, health, energy) never reaches us.
  # Item counts below are from the verification run on 2026-08-07.

  # verified: 100 items, newest 2026-07-22, e.g. "In Togo, the African
  # Development Bank-supported Agro-Food Processing project ..."
  - name: AfDB — milling/grain projects (via Google News site feed)
    url: https://news.google.com/rss/search?q=(mill%20OR%20milling%20OR%20flour%20OR%20grain%20OR%20silo%20OR%20%22food%20processing%22)%20site:afdb.org&hl=en-US&gl=US&ceid=US:en
    type: rss
    language: en
    country: global
    enabled: false

  # verified: 100 items, newest 2026-07-08, e.g. "Ulaanbaatar Flour LLC -
  # Resilience Capacity Building for Wheat ..."
  - name: ADB — milling/grain projects (via Google News site feed)
