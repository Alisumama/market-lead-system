# =============================================================================
# Bastak Market Intelligence System — Source Registry
# =============================================================================
# This is the file YOU edit. To monitor a new website, add one entry below.
#
# Fields per source:
#   name      : human-readable label (shown in logs and, later, in Excel)
#   url       : the RSS/Atom feed URL (for type: rss / google_alert)
#               or the page URL (for type: html / tender — Phase 3, not yet fetched)
#   type      : rss | google_alert | html | tender
#               Phase 1 (collect.py) only fetches: rss, google_alert
#               html / tender entries are stored here for later phases and SKIPPED for now.
#   language  : en | tr | ur | ar | fr | ru  (informational; used later by classify.py)
#   country   : target market, or "global"
#   enabled   : true | false  (set false to pause a source without deleting it)
#
# TIP: Verify each RSS url in a browser before trusting it — feeds move.
#      For anything without a feed, create a Google Alert (delivery: RSS) and
#      paste its feed URL here as type: google_alert. That's the most reliable
#      way to bring non-RSS sites into the pipeline.
# =============================================================================

sources:

  # --- Global industry news (RSS) — VERIFIED WORKING ------------------------
  - name: World-Grain — Articles
    url: https://www.world-grain.com/rss/articles
    type: rss
    language: en
    country: global
    enabled: true

  # Miller Magazine has no native RSS, so we surface its content via a
  # Google News site-scoped feed (verified: ~100 items). Real, working feed.
  - name: Miller Magazine (via Google News site feed)
    url: https://news.google.com/rss/search?q=site:millermagazine.com&hl=en-US&gl=US&ceid=US:en
    type: rss
    language: en
    country: global
    enabled: true

  # Milling and Grain has a real native RSS feed (verified 2026-08-07: HTTP 200,
  # 20 items, newest same-day). /rss.xml 404s — /feed is the working path.
  - name: Milling and Grain — Articles
    url: https://www.millingandgrain.com/feed
    type: rss
    language: en
    country: global
    enabled: true

  # Grain Journal's feed is at /rss.xml — /feed and /rss both 404.
  # (verified 2026-08-07: HTTP 200, 200 items, newest 2026-08-06)
  - name: Grain Journal — Articles
    url: https://www.grainjournal.com/rss.xml
    type: rss
    language: en
    country: global
    enabled: true

  # Feed & Grain blocks direct feed fetches (403 on /feed, /rss, /rss.xml and
  # /articles.rss), so we surface it via a Google News site-scoped feed like
  # Miller Magazine above. The query is keyword-filtered rather than a bare
  # site: search, which keeps navigation pages ("Magazine", "Directory") out.
  # (verified 2026-08-07: HTTP 200, 100 items, newest same-day)
  - name: Feed & Grain (via Google News site feed)
    url: https://news.google.com/rss/search?q=(mill%20OR%20milling%20OR%20grain%20OR%20plant%20OR%20facility)%20site:feedandgrain.com&hl=en-US&gl=US&ceid=US:en
    type: rss
    language: en
    country: global
    enabled: true

  # === REGION-NEUTRAL MILL QUERIES (G1-G5) — global coverage, low noise ======
  # Added 2026-08-07. These REPLACE the per-country queries further down, which
  # are now disabled (kept for reference / easy rollback, not deleted).
  #
  # Design rule, applied to every query below:
  #   (milling-specific MULTI-WORD phrase) AND (project/action term)
  #   and NO country restriction.
  #
  # The key noise fix: the retired queries used bare `grain` / `milling` as
  # standalone terms, which is what dragged in commodity-market reporting
  # (prices, futures, harvest, export bans). Nothing below matches on a bare
  # commodity word — only on multi-word plant/facility phrases.
  #
  # Verified 2026-08-07 by fetching each feed; item counts and a commodity-noise
  # sample check are recorded per entry. Between them G1/G2 surfaced projects in
  # Tajikistan, Saudi Arabia, Cameroon, Cote d'Ivoire and Mongolia — none of
  # which the old per-country feeds could ever have seen.

  # verified: 100 items, newest 2026-08-06, 99/100 on-signal, 0 commodity noise.
  # e.g. "New flour mill commissioned in Tajikistan"
  - name: Mill projects — build/commission (global)
    url: https://news.google.com/rss/search?q=%28%22flour%20mill%22%20OR%20%22grain%20mill%22%20OR%20%22roller%20mill%22%20OR%20%22milling%20plant%22%20OR%20%22milling%20complex%22%29%20%28new%20OR%20construction%20OR%20commissioned%20OR%20inaugurated%20OR%20expansion%29&hl=en-US&gl=US&ceid=US:en
    type: rss
    language: en
    country: global
    enabled: true

  # verified: 48 items, newest 2026-08-06, 2/48 commodity noise.
  # e.g. "Alapala completes turnkey flour mill in Cameroon"
  # Supersedes the old global "milling plant (tender OR contract OR turnkey)".
  - name: Mill tenders & contracts (global)
    url: https://news.google.com/rss/search?q=%28%22flour%20mill%22%20OR%20%22grain%20mill%22%20OR%20%22milling%20plant%22%20OR%20%22flour%20factory%22%29%20%28tender%20OR%20procurement%20OR%20%22contract%20signed%22%20OR%20%22contract%20awarded%22%20OR%20turnkey%29&hl=en-US&gl=US&ceid=US:en
    type: rss
    language: en
    country: global
    enabled: true

  # verified: 50 items, 0 commodity noise. Slower-moving than G1/G2 (newest was
  # 2026-05-20 at verification) — it catches capacity/investment announcements.
  # e.g. "Kazakhstan to Increase Grain Processing Nearly Tenfold by 2028"
