<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set your password — Bastak Market Intelligence</title>
<link rel="stylesheet" href="/public/assets/auth.css">
</head>
<body>
  <div class="card">
    <h1 id="heading">Set your password</h1>
    <p class="sub" id="subheading">Checking your invite link...</p>

    <form id="pw-form" class="hidden" novalidate>
      <label for="password">New password</label>
      <div class="pw-field">
        <input type="password" id="password" autocomplete="new-password" required>
        <button type="button" class="eye-toggle" id="pw-toggle" aria-label="Show password">&#128065;</button>
      </div>
      <ul class="checklist" id="checklist"></ul>
      <div class="strength-meter" id="strength-meter"></div>

      <label for="confirm">Confirm password</label>
      <div class="pw-field">
        <input type="password" id="confirm" autocomplete="new-password" required>
        <button type="button" class="eye-toggle" id="confirm-toggle" aria-label="Show password">&#128065;</button>
      </div>
      <div class="error-box" id="mismatch-box">Passwords don't match.</div>

      <button type="submit" class="btn" id="submit-btn" disabled>Set password &amp; continue</button>
    </form>

    <div class="error-box" id="error-box"></div>
    <p class="footnote"><a class="link" href="/login">Back to sign in</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/public/assets/auth.js"></script>
  <script>
    const errorBox = document.getElementById("error-box");
    const form = document.getElementById("pw-form");
    const heading = document.getElementById("heading");
    const subheading = document.getElementById("subheading");

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add("show");
    }

    let currentSession = null;
    let passwordValid = false;

    function checkFormReady() {
      const confirmVal = document.getElementById("confirm").value;
      const pwVal = document.getElementById("password").value;
      const mismatchBox = document.getElementById("mismatch-box");
      const mismatch = confirmVal.length > 0 && confirmVal !== pwVal;
      mismatchBox.classList.toggle("show", mismatch);
      document.getElementById("submit-btn").disabled = !(passwordValid && confirmVal && !mismatch);
    }

    wireEyeToggle(document.getElementById("password"), document.getElementById("pw-toggle"));
    wireEyeToggle(document.getElementById("confirm"), document.getElementById("confirm-toggle"));
    wirePasswordStrength({
      inputEl: document.getElementById("password"),
      checklistEl: document.getElementById("checklist"),
      meterEl: document.getElementById("strength-meter"),
      onValidityChange: (valid) => { passwordValid = valid; checkFormReady(); },
    });
    document.getElementById("confirm").addEventListener("input", checkFormReady);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentSession) { showError("Your session expired — request a new link."); return; }
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Saving...";
      try {
        const supabase = await getSupabaseClient();
        const { error } = await supabase.auth.updateUser({
          password: document.getElementById("password").value,
        });
        if (error) throw error;
        // Password is set and the user is already signed in from the
        // invite/recovery link — hand that session to the server the same
        // way a normal login does, then go straight to the dashboard.
        await handoffSessionToServer(currentSession);
        window.location.href = "/";
      } catch (err) {
        showError(friendlyAuthError(err));
        btn.disabled = false;
        btn.textContent = "Set password & continue";
      }
    });

    (async () => {
      const supabase = await getSupabaseClient();

      supabase.auth.onAuthStateChange((event, session) => {
        if (session && (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN")) {
          currentSession = session;
          heading.textContent = "Set your password";
          subheading.textContent = "Choose a password for " + (session.user?.email || "your account") + ".";
          form.classList.remove("hidden");
        }
      });

      // Fallback: if the redirect already carried a valid session before our
      // listener attached, onAuthStateChange may not fire again — check directly.
      const { data } = await supabase.auth.getSession();
      if (data.session && !currentSession) {
        currentSession = data.session;
        heading.textContent = "Set your password";
        subheading.textContent = "Choose a password for " + (data.session.user?.email || "your account") + ".";
        form.classList.remove("hidden");
      }

      // Give the URL-hash session detection a moment; if nothing showed up,
      // this link is invalid, expired, or already used.
      setTimeout(() => {
        if (!currentSession) {
          subheading.textContent = "";
          showError("This link is invalid or has expired. Go back to sign in and use “Forgot password?” to request a new one.");
        }
      }, 2500);
    })().catch((err) => showError(err.message));
  </script>
</body>
</html>
