<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Bastak Market Intelligence</title>
<link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
  <div class="card">
    <h1>Bastak Market Intelligence</h1>
    <p class="sub">Sign in to view leads. Access is invite-only.</p>

    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>

      <label for="password">Password</label>
      <div class="pw-field">
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="button" class="eye-toggle" id="pw-toggle" aria-label="Show password">&#128065;</button>
      </div>

      <button type="submit" class="btn" id="signin-btn">Sign in</button>
    </form>

    <div class="links-row">
      <a class="link" id="forgot-link">Forgot password?</a>
    </div>

    <div class="forgot-panel" id="forgot-panel">
      <p class="forgot-copy" id="forgot-copy"></p>
      <button type="button" class="btn secondary" id="forgot-btn">Send reset link</button>
    </div>

    <div class="error-box" id="error-box"></div>
    <div class="info-box" id="info-box"></div>

    <p class="footnote">Access is by invitation only. If you don't have an account,<br>contact your administrator to be added.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/auth.js"></script>
  <script>
    const errorBox = document.getElementById("error-box");
    const infoBox = document.getElementById("info-box");
    function showError(msg) {
      infoBox.classList.remove("show");
      errorBox.textContent = msg;
      errorBox.classList.add("show");
    }
    function showInfo(msg) {
      errorBox.classList.remove("show");
      infoBox.textContent = msg;
      infoBox.classList.add("show");
    }
    function clearMessages() {
      errorBox.classList.remove("show");
      infoBox.classList.remove("show");
    }

    wireEyeToggle(document.getElementById("password"), document.getElementById("pw-toggle"));

    // The reset flow deliberately reuses the SAME email field the user
    // typed into for sign-in — there used to be a second, separate "email
    // to reset" field, and it was possible to fill that in with a different
    // (or no) address than the one you meant to sign in with, leading to a
    // reset link going to the wrong inbox (or nowhere) while the user kept
    // assuming they'd reset their own password. One field, no ambiguity.
    document.getElementById("forgot-link").addEventListener("click", () => {
      clearMessages();
      const email = document.getElementById("email").value.trim();
      const panel = document.getElementById("forgot-panel");
      if (!email) {
        panel.classList.remove("show");
        showError('Enter your email in the field above first, then click "Forgot password?" again.');
        document.getElementById("email").focus();
        return;
      }
      document.getElementById("forgot-copy").textContent =
        "We'll send a password reset link to: " + email;
      panel.classList.toggle("show");
    });

    // Redirect target after a successful login (works whether the gate
    // route is "/" or "/dashboard" — both are wired to api/dashboard.js).
    const REDIRECT_AFTER_LOGIN = "/";

    async function completeLogin(session) {
      await handoffSessionToServer(session);
      window.location.href = REDIRECT_AFTER_LOGIN;
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessages();
      const btn = document.getElementById("signin-btn");
      btn.disabled = true;
      btn.textContent = "Signing in...";
      try {
        const supabase = await getSupabaseClient();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        if (!data.session) throw new Error("Sign-in did not return a session.");
        await completeLogin(data.session);
      } catch (err) {
        showError(friendlyAuthError(err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });

    // Goes through our own /api/request-password-reset instead of calling
    // supabase.auth.resetPasswordForEmail() directly, so we can tell the
    // user plainly whether their email is even eligible (Supabase's own
    // method always reports success either way, to prevent enumeration —
    // deliberately traded off here per product decision, since this is an
    // invite-only tool for a handful of named colleagues, not a public
    // signup surface).
    document.getElementById("forgot-btn").addEventListener("click", async () => {
      clearMessages();
      const btn = document.getElementById("forgot-btn");
      const email = document.getElementById("email").value.trim();
      if (!email) { showError("Enter your email above first."); return; }
      btn.disabled = true;
      btn.textContent = "Sending...";
      try {
        const res = await fetch("/api/request-password-reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const body = await res.json().catch(() => ({}));

        if (body.reason === "not_allowed") {
          showError(email + " isn't on the approved list for this dashboard. Contact your administrator.");
        } else if (body.reason === "rate_limited") {
          primeRetryAfter(body.retryAfterSeconds);
          showError(friendlyAuthError({ status: 429, code: body.code, message: body.message }));
        } else if (!res.ok || body.ok !== true) {
          showError(body.message || "Something went wrong sending the reset link. Please try again.");
        } else {
          showInfo("Reset link sent to " + body.email + " — check that inbox.");
          document.getElementById("forgot-panel").classList.remove("show");
        }
      } catch (err) {
        showError("Something went wrong sending the reset link. Please try again.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
